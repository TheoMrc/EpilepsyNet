<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description"
              content="EFAS - Annotation platform for zebrafish videos." />
        <meta name="keywords"
              content="EFAS, annotation, videos, zebrafish, research, machine learning" />
        <title>Home - EFAS</title>
        <link rel="icon"
              type="image/x-icon"
              href="{{ url_for('static', filename='favicon.ico') }}" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/styles.css') }}" />
        {% block head %}
        {% endblock head %}
    </head>
    <body>
        <div class="banner">
            <img src="{{ url_for('static', filename='logo.png') }}"
                 class="logo"
                 alt="Logo"
                 height="62.5"
                 width="85" />
            <h1>EFAS</h1>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('choose_experiment') }}">Choose an experiment</a>
            {% if chosen_experiment %}
                <a href="{{ url_for('list_videos') }}">View loaded videos</a>
                <a href="{{ url_for('load_unannotated_video') }}">Continue annotating</a>
            {% endif %}
            <a href="{{ url_for('leaderboard') }}" id="leaderboard-logo">
                <img src="{{ url_for('static', filename='Leaderboard.png') }}"
                     class="leaderboard-logo"
                     alt="Leaderboard"
                     height="40"
                     width="40" />
            </a>
        </div>
        {% block content %}
        {% endblock content %}
        <div class="footer">
            <p>© 2025 EFAS. All rights reserved.</p>
        </div>
    </body>
</html>
